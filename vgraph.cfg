# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. core (image model) is the base; compress
# (pure-Nim Deflate) and formats (codecs) sit above core; process (resize/crop/
# rotate) sits above formats and imports core only; exif (metadata) may import
# core and compress, but no image codec; c_api may import all of them. PNG
# imports compress (Deflate), so compress is below formats.
[layers]
core
isobmff
compress
formats
process
exif
c_api

# Uni* engines this repo may name in `requires`. Any Uni* absent here is a
# back-edge in the family DAG. Non-Uni deps (nim, NimContracts, nimsimd) are
# external infra and go unchecked. Listed engines document the permitted DAG
# position; the dependency checker does not imply that they are required.
[engines]
UniChecksum
UniColor
UniCompress
UniContainer
UniLinalg
